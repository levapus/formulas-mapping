<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Формулы — подбор продуктов</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Подбор продуктов по условиям</h1>
      <p class="hint">Выберите условия — ниже таблица продуктов по категориям. Галочки: рекомендуется / не рекомендуется (оба могут быть отмечены).</p>

      <label class="block">
        Категория
        <select id="categoryFilter">
          <option value="">Все</option>
        </select>
      </label>

      <div class="block">
        <span class="field-label">Условие</span>
        <div class="condition-row">
          <input id="conditionInput" type="search" autocomplete="off" placeholder="Начните вводить…" />
          <button type="button" id="micButton" class="mic-button" title="Голосовой ввод (например: Луна)" aria-label="Голосовой ввод">
            🎤
          </button>
        </div>
      </div>
      <div id="suggestionPanel" class="suggestion-panel" hidden>
        <ul id="suggestions" class="suggestions"></ul>
        <div class="suggestion-pager">
          <button type="button" id="suggestionPrev">Назад</button>
          <span id="suggestionPageInfo" class="suggestion-page-info"></span>
          <button type="button" id="suggestionNext">Вперёд</button>
        </div>
      </div>
      <div id="chips" class="chips"></div>

      <p id="status" class="status"></p>

      <section class="results-section">
        <h2>Результаты</h2>
        <div class="results-table-wrap">
          <table id="resultsTable" class="results-table">
            <thead>
              <tr>
                <th>Категория / продукт</th>
                <th>Рекомендуется</th>
                <th>Не рекомендуется</th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
        <p id="resultsEmpty" class="results-empty" hidden>Выберите условия, чтобы увидеть продукты</p>
      </section>

      <label class="block">
        Загрузить data.json
        <input id="fileInput" type="file" accept="application/json,.json" />
      </label>
    </main>
    <!-- Classic scripts (not type=module) so file:// double-click + JSON picker works in Chrome -->
    <script src="lookup.js"></script>
    <script src="app.js"></script>
  </body>
</html>
